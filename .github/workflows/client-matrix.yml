name: client-matrix

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-client-matrix.mjs
      - run: bash scripts/test.sh
