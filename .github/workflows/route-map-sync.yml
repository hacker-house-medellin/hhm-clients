name: route-map-sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check out immutable route-map authority inside the workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hacker-house-medellin/hhm-lib-core
          ref: cbc95b7748e4823f86483151124098510c8f21f3
          path: hhm-lib-core
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate route maps and generated clients
        run: |
          set -euo pipefail
          sibling="$GITHUB_WORKSPACE/../hhm-lib-core"
          test ! -e "$sibling"
          ln -s "$GITHUB_WORKSPACE/hhm-lib-core" "$sibling"
          trap 'rm -f "$sibling"' EXIT
          python3 scripts/check-route-sync.py --root .
