[package]
org = "hacker-house-medellin"
name = "hhm-clients"
version = "0.1.0"
description = "Polyglot SDK clients for Hacker House Medellín"
license = "MIT"
language = "polyglot"

[package.repository]
vcs = "git"
url = "https://github.com/hacker-house-medellin/hhm-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"hacker-house-medellin/hhm-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log", ".vendor/.zed/**"]

[scripts]
test = "bash scripts/test.sh"
