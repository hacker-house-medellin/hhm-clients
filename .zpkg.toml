[package]
org = "hacker-house-medellin"
name = "hhm-clients"
version = "0.1.0"
description = "Polyglot SDK clients for Hacker House Medellín"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "openapi"]

[package.repository]
vcs = "git"
url = "https://github.com/hacker-house-medellin/hhm-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"hacker-house-medellin/hhm-interfaces" = "^0.1.0"
"hacker-house-medellin/hhm-libs" = "^0.1.0"
"hacker-house-medellin/hhm-lib" = "^0.1.0"
# Source admission: tests/claritas-source.json. No reviewed registry release is claimed.
"claritas-viz/claritas-pub-lib-core" = "0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "build/**", ".build/**", "*.log", ".vendor/.zed/**", ".zed/**", ".source-candidates/**"]

[scripts]
test = "bash scripts/test.sh"
# Other commands are schema-v2 tasks in zed-env.toml, not manifest scripts.

[targets.repository]
dir = "."

[targets.c]
dir = "clients/c"
adapter = "none"

[targets.cpp]
dir = "clients/cpp"
adapter = "none"

[targets.zig]
dir = "clients/zig"
adapter = "none"

# TypeScript is the Node.js Zed target. Deno, Bun, and edge remain explicit
# runtime entry points inside this package rather than unsupported Zed targets.
[targets.nodejs]
dir = "clients/typescript"
name = "hhm-clients-typescript"
adapter = "node"

[targets.golang]
dir = "clients/golang"
adapter = "none"

[targets.python]
dir = "clients/python"
adapter = "none"

[targets.ruby]
dir = "clients/ruby"
adapter = "none"

[targets.php]
dir = "clients/php"
adapter = "none"

[targets.rust]
dir = "clients/rust"
adapter = "none"

[targets.rust-wasm]
dir = "clients/wasm"
adapter = "node"

[targets.dart]
dir = "clients/dart"
adapter = "none"

[targets.gleam]
dir = "clients/gleam"
adapter = "none"

[targets.erlang]
dir = "clients/erlang"
adapter = "none"

[targets.elixir]
dir = "clients/elixir"
adapter = "none"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.kotlin]
dir = "clients/kotlin"
adapter = "java"

[targets.swift]
dir = "clients/swift"
adapter = "none"
