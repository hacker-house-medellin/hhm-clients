openapi: 3.1.0
info:
  title: Hacker House Medellín Edge API
  version: 0.1.0
servers:
  - url: https://api.example.com
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Healthy
  /api/config:
    get:
      operationId: getConfig
      responses:
        '200':
          description: Product configuration
  /api/events:
    post:
      operationId: emitEvent
      responses:
        '202':
          description: Event accepted
  /api/alerts:
    post:
      operationId: emitAlert
      responses:
        '202':
          description: Alert accepted
